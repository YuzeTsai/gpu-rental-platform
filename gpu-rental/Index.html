<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg:#0b0f17; --panel:#121826; --panel2:#182033; --line:#243049; --text:#e6edf7; --mute:#8b9bb4;
    --acc:#22d3ee; --acc2:#a78bfa; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
  button { font:inherit; cursor:pointer; }
  input, select, textarea { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--acc); border-color:transparent; }
  input[type=date] { color-scheme:dark; }
  header { position:sticky; top:0; z-index:5; background:rgba(11,15,23,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .bar { max-width:1120px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .logo { font-weight:800; font-size:18px; letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  .logo span { background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .logo i { font-style:normal; width:30px; height:30px; display:grid; place-items:center; border-radius:8px; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#0b0f17; }
  nav { display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; }
  nav button { background:none; border:0; color:var(--mute); padding:8px 14px; border-radius:99px; }
  nav button.on { color:#0b0f17; background:var(--acc); font-weight:700; }
  main { max-width:1120px; margin:0 auto; padding:24px 20px 60px; }
  h2 { margin:0 0 4px; font-size:22px; } h3 { margin:0; }
  .mute { color:var(--mute); } .small { font-size:13px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .btn { background:linear-gradient(90deg,var(--acc),var(--acc2)); color:#0b0f17; border:0; border-radius:10px; padding:10px 18px; font-weight:700; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .ghost { background:none; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:9px 16px; }
  .danger { background:none; border:1px solid var(--bad); color:var(--bad); border-radius:10px; padding:8px 14px; }

  /* 方案介紹 */
  .hero { position:relative; overflow:hidden; border-radius:20px; padding:32px; margin-bottom:22px; border:1px solid var(--line);
    background:radial-gradient(600px 240px at 85% 0%,rgba(167,139,250,.35),transparent),radial-gradient(500px 220px at 0% 100%,rgba(34,211,238,.25),transparent),var(--panel); }
  .hero h1 { margin:0 0 6px; font-size:30px; }
  .hero p { margin:0; color:#c7d2e4; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:22px; }
  .kpi { background:rgba(11,15,23,.55); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .kpi b { display:block; font-size:24px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .chip { background:var(--panel); border:1px solid var(--line); color:var(--mute); border-radius:99px; padding:6px 14px; }
  .chip.on { border-color:var(--acc); color:var(--acc); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .gpu { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:6px; transition:.15s; }
  .gpu:hover { border-color:var(--acc); transform:translateY(-2px); }
  .gtop { display:flex; justify-content:space-between; align-items:center; }
  .tier { font-size:12px; padding:2px 10px; border-radius:99px; border:1px solid currentColor; }
  .tier-入門 { color:#94a3b8; } .tier-進階 { color:var(--acc); } .tier-旗艦 { color:#f472b6; } .tier-工作站 { color:var(--warn); } .tier-資料中心 { color:var(--acc2); }
  .avail { font-size:12px; color:var(--mute); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .dot.none { background:var(--bad); box-shadow:0 0 8px var(--bad); }
  .vram b { font-size:30px; font-weight:800; }
  .use { color:var(--acc); font-size:13px; margin:0; }
  .intro { color:var(--mute); font-size:13px; margin:0; flex:1; }
  .gfoot { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:10px; margin-top:4px; }
  .price b { font-size:22px; }

  /* 租借流程 */
  .steps { display:flex; gap:8px; margin-bottom:18px; }
  .step { flex:1; display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:12px; background:var(--panel); border:1px solid var(--line); color:var(--mute); font-size:14px; }
  .step i { font-style:normal; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--line); font-size:12px; flex:none; }
  .step.on { border-color:var(--acc); color:var(--text); } .step.on i { background:var(--acc); color:#0b0f17; }
  .step.done i { background:var(--ok); color:#0b0f17; }
  .layout { display:grid; grid-template-columns:1fr 300px; gap:18px; align-items:start; }
  .sum { position:sticky; top:80px; }
  .sum .row, .lines .row { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .sum .total, .lines .total { font-size:22px; font-weight:800; color:var(--acc); border:0; }
  .pick { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
  .opt { text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; color:var(--text); }
  .opt.on { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset; }
  .opt:disabled { opacity:.35; }
  .slots { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-top:8px; }
  .slot { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:6px 2px; color:var(--text); text-align:center; font-size:13px; }
  .slot small { display:block; font-size:11px; color:var(--ok); }
  .slot.full small { color:var(--bad); } .slot.full, .slot.past { opacity:.35; cursor:not-allowed; }
  .slot.in { background:rgba(34,211,238,.18); border-color:var(--acc); }
  .slot.bad { background:rgba(248,113,113,.2); border-color:var(--bad); }
  .hrs { display:flex; gap:6px; flex-wrap:wrap; }
  .hrs button { background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:6px 12px; }
  .hrs button.on { border-color:var(--acc); color:var(--acc); }
  label { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; } label b { color:var(--bad); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .msg { font-size:13px; margin-top:6px; } .msg.ok { color:var(--ok); } .msg.err { color:var(--bad); }
  .nav2 { display:flex; justify-content:space-between; margin-top:20px; }
  .done-box { text-align:center; padding:36px 20px; }
  .done-box .big { width:72px; height:72px; margin:0 auto 12px; border-radius:50%; display:grid; place-items:center; font-size:36px; background:rgba(52,211,153,.15); color:var(--ok); border:2px solid var(--ok); }
  .lines { max-width:420px; margin:16px auto; text-align:left; }
  .agree { display:flex; gap:8px; align-items:flex-start; margin-top:14px; font-size:14px; }
  .agree input { width:auto; margin-top:4px; }

  /* 訂單 */
  .search { display:flex; gap:10px; } .search input { flex:1; }
  .order { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:12px; display:grid; grid-template-columns:1fr auto; gap:6px 16px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:700; }
  .b-已預約 { background:rgba(34,211,238,.15); color:var(--acc); } .b-使用中 { background:rgba(52,211,153,.15); color:var(--ok); }
  .b-逾時中 { background:rgba(248,113,113,.18); color:var(--bad); } .b-已結束 { background:#243049; color:var(--mute); } .b-已取消 { background:#243049; color:var(--mute); text-decoration:line-through; }
  .notice { border-radius:12px; padding:12px 14px; margin-top:12px; font-size:14px; background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.4); }
  .notice.warn { background:rgba(248,113,113,.1); border-color:rgba(248,113,113,.4); }

  /* 報表 */
  .tiles { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin:16px 0; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .tile b { display:block; font-size:22px; } .tile span { font-size:13px; color:var(--mute); }
  .cols2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  .hbar { display:grid; grid-template-columns:130px 1fr 76px; align-items:center; gap:8px; font-size:13px; margin:7px 0; }
  .hbar .track { background:var(--panel2); border-radius:6px; height:14px; overflow:hidden; }
  .hbar .fill { height:100%; border-radius:6px; background:linear-gradient(90deg,var(--acc),var(--acc2)); }
  .hbar .v { text-align:right; color:var(--mute); }
  .vbars { display:flex; align-items:flex-end; gap:6px; height:180px; padding-top:20px; }
  .vbars div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; font-size:11px; color:var(--mute); }
  .vbars i { width:100%; border-radius:6px 6px 0 0; background:linear-gradient(180deg,var(--acc2),var(--acc)); min-height:2px; }
  .vbars em { font-style:normal; color:var(--text); font-size:10px; margin-bottom:2px; }
  table { width:100%; border-collapse:collapse; font-size:14px; } th, td { padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; } th { color:var(--mute); font-weight:600; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--bad); color:#fff; padding:10px 18px; border-radius:10px; display:none; z-index:9; }
  .loading { padding:60px; text-align:center; color:var(--mute); }

  @media (max-width:820px) {
    .layout, .cols2 { grid-template-columns:1fr; } .sum { position:static; }
    .kpis { grid-template-columns:repeat(2,1fr); } .tiles { grid-template-columns:repeat(2,1fr); }
    .slots { grid-template-columns:repeat(4,1fr); } .steps .step span { display:none; } .two { grid-template-columns:1fr; }
    nav { margin-left:0; }
  }
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo"><i>⚡</i><span>GPU Cloud</span> 算力顯卡租借平台</div>
  <nav id="nav">
    <button data-p="plans">方案介紹</button><button data-p="rent">立即租借</button><button data-p="orders">我的訂單</button><button data-p="report">營運報表</button>
  </nav>
</div></header>
<main id="app"><div class="loading">載入中…</div></main>
<div id="toast"></div>

<script>
const HOUR = 36e5, DAY = 24 * HOUR;
const S = { page:'plans', tier:'全部', step:1, gpu:null, date:null, start:null, hours:4, slots:null,
  f:{ name:'', email:'', role:'一般', sid:'', purpose:'', coupon:'' }, cp:null, agree:false, order:null, q:'', list:null, note:null };
let INIT;

const $ = s => document.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const money = n => 'NT$' + Math.round(n).toLocaleString('en-US');
const tp = ms => { const d = new Date(ms + 8 * HOUR); return { y:d.getUTCFullYear(), M:d.getUTCMonth() + 1, d:d.getUTCDate(), h:d.getUTCHours(), w:'日一二三四五六'[d.getUTCDay()] }; };
const pad = n => String(n).padStart(2, '0');
const when = ms => { const t = tp(ms); return `${t.M}/${t.d}（${t.w}）${pad(t.h)}:00`; };
const whenM = ms => { const t = tp(ms); return `${t.M}/${t.d} ${pad(t.h)}:${pad(new Date(ms + 8 * HOUR).getUTCMinutes())}`; };
const isoDay = ms => { const t = tp(ms); return `${t.y}-${pad(t.M)}-${pad(t.d)}`; };
const plan = id => INIT.plans.find(p => p.id === id);
const api = (fn, ...args) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));
function toast(e) { const t = $('#toast'); t.textContent = e.message || e; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3500); }

function go(p) { S.page = p; render(); window.scrollTo(0, 0); }
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.p));

function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.p === S.page));
  $('#app').innerHTML = PAGES[S.page]();
  if (S.page === 'report' && !S.rep) loadReport();
}

// ---------- 價格計算（送出時伺服器會再算一次） ----------
function price() {
  const p = plan(S.gpu);
  if (!p) return null;
  const base = p.price * S.hours, s = S.f.role === '學生' ? INIT.studentRate : 1, c = S.cp ? S.cp.rate : 1;
  const total = Math.round(base * s * c), stuOff = base - base * s;
  return { base, stuOff, cpOff: base - stuOff - total, total };
}

const PAGES = {
  plans() {
    const ps = INIT.plans, tiers = ['全部', ...new Set(ps.map(p => p.tier))];
    const list = ps.filter(p => S.tier === '全部' || p.tier === S.tier);
    return `<section class="hero"><h1>按小時租用 GPU 算力</h1>
      <p>從入門的 RTX 3060 到頂規 B200，共 ${ps.length} 款顯卡。線上預約、即時計價，學生享 ${INIT.studentRate * 10} 折。</p>
      <div class="kpis">
        <div class="kpi"><b>${ps.length}</b><span class="mute small">顯卡款式</span></div>
        <div class="kpi"><b>${ps.reduce((s, p) => s + p.units, 0)}</b><span class="mute small">總台數</span></div>
        <div class="kpi"><b style="color:var(--ok)">${ps.reduce((s, p) => s + p.free, 0)}</b><span class="mute small">目前可用</span></div>
        <div class="kpi"><b>${money(Math.min(...ps.map(p => p.price)))}</b><span class="mute small">最低時租</span></div>
      </div></section>
      <div class="chips">${tiers.map(t => `<button class="chip ${t === S.tier ? 'on' : ''}" onclick="S.tier='${t}';render()">${t}</button>`).join('')}</div>
      <div class="grid">${list.map(p => `<div class="gpu">
        <div class="gtop"><span class="tier tier-${p.tier}">${p.tier}</span>
          <span class="avail"><i class="dot ${p.free ? '' : 'none'}"></i>${p.free ? `可用 ${p.free}/${p.units} 台` : '目前已滿'}</span></div>
        <h3>${h(p.name)}</h3>
        <div class="vram"><b>${p.vram}</b> <span class="mute">GB VRAM</span></div>
        <p class="use">▸ ${h(p.use)}</p><p class="intro">${h(p.intro)}</p>
        <div class="gfoot"><div class="price"><b>${money(p.price)}</b><span class="mute small"> / 小時</span></div>
          <button class="btn" onclick="rentGpu('${p.id}')">租借</button></div></div>`).join('')}</div>`;
  },

  rent() {
    if (S.order) return doneView();
    const names = ['選擇顯卡', '選擇時段', '填寫資料', '確認訂單'];
    return `<h2>立即租借</h2><p class="mute">四個步驟完成預約，右側會即時顯示費用。</p>
      <div class="steps">${names.map((n, i) => `<div class="step ${S.step === i + 1 ? 'on' : S.step > i + 1 ? 'done' : ''}"><i>${S.step > i + 1 ? '✓' : i + 1}</i><span>${n}</span></div>`).join('')}</div>
      <div class="layout"><div class="panel">${[step1, step2, step3, step4][S.step - 1]()}</div>${summary()}</div>`;
  },

  orders() {
    return `<h2>我的訂單</h2><p class="mute">輸入預約時填寫的 Email 或訂單編號，可查詢、取消預約或結束租用。</p>
      <div class="panel"><div class="search"><input id="q" placeholder="例如 you@example.com 或 R0012" value="${h(S.q)}">
        <button class="btn" onclick="search()">查詢</button></div>
      ${S.note ? `<div class="notice ${S.note.warn ? 'warn' : ''}">${S.note.html}</div>` : ''}
      ${S.list === null ? '' : S.list.length ? S.list.map(orderCard).join('') : '<p class="mute">查無訂單。</p>'}</div>`;
  },

  report() {
    const r = S.rep;
    if (!r) return '<div class="loading">統計資料載入中…</div>';
    const maxRev = Math.max(...r.gpus.map(g => g.revenue), 1), maxDay = Math.max(...r.daily.map(d => d.revenue), 1);
    const byRev = r.gpus.slice().sort((a, b) => b.revenue - a.revenue);
    const byUtil = r.gpus.slice().sort((a, b) => b.util - a.util);
    const pct = x => (x * 100).toFixed(1) + '%';
    return `<div style="display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:10px">
        <div><h2>營運報表</h2><p class="mute">統計近 ${r.days} 天（依開始時間，不含已取消訂單）。</p></div>
        <button class="ghost" onclick="S.rep=null;render()">↻ 重新整理</button></div>
      <div class="tiles">
        <div class="tile"><span>總營收</span><b style="color:var(--acc)">${money(r.revenue)}</b></div>
        <div class="tile"><span>訂單數</span><b>${r.count}</b></div>
        <div class="tile"><span>租用時數</span><b>${r.hours} 小時</b></div>
        <div class="tile"><span>整體使用率</span><b>${pct(r.util)}</b></div>
        <div class="tile"><span>目前使用中</span><b style="color:var(--ok)">${r.inUse} 筆</b></div>
        <div class="tile"><span>逾時中</span><b style="color:var(--bad)">${r.overdue.length} 筆</b></div>
      </div>
      ${r.overdue.length ? `<div class="notice warn">⚠️ 逾時未結束：${r.overdue.map(o => `${o.no} ${h(o.gpuName)}（${h(o.name)}，應於 ${when(o.end)} 結束）`).join('、')}</div>` : ''}
      <div class="panel" style="margin-top:14px"><h3>近 14 天每日營收</h3>
        <div class="vbars">${r.daily.map(d => `<div><em>${d.revenue ? (d.revenue / 1000).toFixed(1) + 'k' : ''}</em><i style="height:${d.revenue / maxDay * 100}%"></i>${d.day}</div>`).join('')}</div></div>
      <div class="cols2">
        <div class="panel"><h3>各顯卡營收排名</h3>${byRev.map(g => `<div class="hbar"><span>${h(g.name)}</span><div class="track"><div class="fill" style="width:${g.revenue / maxRev * 100}%"></div></div><span class="v">${money(g.revenue)}</span></div>`).join('')}</div>
        <div class="panel"><h3>各顯卡使用率</h3>${byUtil.map(g => `<div class="hbar"><span>${h(g.name)}</span><div class="track"><div class="fill" style="width:${Math.min(g.util * 100 / Math.max(byUtil[0].util, .01), 100)}%"></div></div><span class="v">${pct(g.util)}</span></div>`).join('')}</div>
      </div>
      <div class="cols2">
        <div class="panel"><h3>熱門顯卡（訂單數）</h3><table><tr><th>#</th><th>顯卡</th><th>等級</th><th>訂單</th><th>時數</th></tr>
          ${r.gpus.slice().sort((a, b) => b.orders - a.orders).slice(0, 6).map((g, i) => `<tr><td>${i + 1}</td><td>${h(g.name)}</td><td><span class="tier tier-${g.tier}">${g.tier}</span></td><td>${g.orders}</td><td>${g.hours}</td></tr>`).join('')}</table></div>
        <div class="panel"><h3>客群與優惠</h3>
          <div class="hbar"><span>學生訂單</span><div class="track"><div class="fill" style="width:${r.students / Math.max(r.count, 1) * 100}%"></div></div><span class="v">${r.students} 筆</span></div>
          <div class="hbar"><span>一般訂單</span><div class="track"><div class="fill" style="width:${(r.count - r.students) / Math.max(r.count, 1) * 100}%"></div></div><span class="v">${r.count - r.students} 筆</span></div>
          ${Object.entries(r.coupons).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<div class="hbar"><span>優惠碼 ${h(c)}</span><div class="track"><div class="fill" style="width:${n / r.count * 100}%"></div></div><span class="v">${n} 次</span></div>`).join('')}
          <p class="mute small" style="margin-top:12px">逾時費收入：${money(r.otFee)}</p></div>
      </div>`;
  },
};

// ---------- 租借四步驟 ----------
function step1() {
  return `<h3>1. 選擇顯卡</h3><p class="mute small">灰色代表目前已全部租出，但仍可預約之後的時段。</p>
    <div class="pick">${INIT.plans.map(p => `<button class="opt ${S.gpu === p.id ? 'on' : ''}" onclick="S.gpu='${p.id}';S.slots=null;S.start=null;render()">
      <b>${h(p.name)}</b> <span class="tier tier-${p.tier}" style="font-size:11px">${p.tier}</span><br>
      <span class="mute small">${p.vram}GB ・ ${money(p.price)}/時 ・ </span><span class="small" style="color:${p.free ? 'var(--ok)' : 'var(--bad)'}">可用 ${p.free}/${p.units}</span></button>`).join('')}</div>
    <div class="nav2"><span></span><button class="btn" ${S.gpu ? '' : 'disabled'} onclick="next()">下一步：選擇時段 →</button></div>`;
}

function step2() {
  const p = plan(S.gpu), today = isoDay(INIT.now);
  if (!S.date) S.date = today;
  if (!S.slots) { loadSlots(); return '<div class="loading">讀取時段中…</div>'; }
  const { day0, used } = S.slots, nowH = Math.floor(Date.now() / HOUR) * HOUR;
  const si = S.start == null ? -1 : (S.start - day0) / HOUR;
  const conflict = si >= 0 ? used.slice(si, si + S.hours).filter(u => u >= p.units).length : 0;
  const cells = [];
  for (let i = 0; i < 24; i++) {
    const t = day0 + i * HOUR, left = p.units - used[i], past = t < nowH, inSel = si >= 0 && i >= si && i < si + S.hours;
    cells.push(`<button class="slot ${past ? 'past' : left <= 0 ? 'full' : ''} ${inSel ? (left <= 0 ? 'bad' : 'in') : ''}" ${past || left <= 0 ? 'disabled' : ''} onclick="S.start=${t};render()">
      ${pad(i)}:00<small>${past ? '—' : left <= 0 ? '已滿' : '剩 ' + left}</small></button>`);
  }
  return `<h3>2. 選擇時段</h3><p class="mute small">${h(p.name)} 共 ${p.units} 台。點選開始時間，再選擇租用時數。</p>
    <div class="two"><div><label>日期</label><input type="date" value="${S.date}" min="${today}" max="${isoDay(INIT.now + 30 * DAY)}" onchange="S.date=this.value;S.start=null;S.slots=null;render()"></div>
    <div><label>租用時數</label><div class="hrs">${[1, 2, 3, 4, 6, 8, 12, 24, 48, 72].map(n => `<button class="${S.hours === n ? 'on' : ''}" onclick="S.hours=${n};render()">${n}h</button>`).join('')}</div></div></div>
    <label>開始時間</label><div class="slots">${cells.join('')}</div>
    ${si >= 0 ? `<div class="msg ${conflict ? 'err' : 'ok'}">${conflict ? `⚠ 所選時段中有 ${conflict} 小時已被租滿，請調整開始時間或時數。` : `✓ ${when(S.start)} 開始，${when(S.start + S.hours * HOUR)} 結束，共 ${S.hours} 小時。`}</div>` : ''}
    <div class="nav2"><button class="ghost" onclick="S.step=1;render()">← 上一步</button>
      <button class="btn" ${si >= 0 && !conflict ? '' : 'disabled'} onclick="next()">下一步：填寫資料 →</button></div>`;
}

function step3() {
  const f = S.f;
  return `<h3>3. 填寫資料</h3>
    <div class="two"><div><label>姓名 <b>*</b></label><input id="f-name" value="${h(f.name)}" placeholder="王小明"></div>
    <div><label>Email <b>*</b></label><input id="f-email" type="email" value="${h(f.email)}" placeholder="確認信與連線資訊會寄到這裡"></div></div>
    <label>身分</label><div class="pick" style="grid-template-columns:1fr 1fr">
      ${['一般', '學生'].map(r => `<button class="opt ${f.role === r ? 'on' : ''}" onclick="keep();S.f.role='${r}';render()"><b>${r}</b><br><span class="mute small">${r === '學生' ? `憑學號享 ${INIT.studentRate * 10} 折` : '原價計費'}</span></button>`).join('')}</div>
    ${f.role === '學生' ? `<label>學號 <b>*</b></label><input id="f-sid" value="${h(f.sid)}" placeholder="例：B11201234">` : ''}
    <label>用途</label><textarea id="f-purpose" rows="2" placeholder="例：專題 LoRA 微調">${h(f.purpose)}</textarea>
    <label>優惠碼</label><div class="search"><input id="f-coupon" value="${h(f.coupon)}" placeholder="選填，例如 AI2026"><button class="ghost" onclick="applyCoupon()">套用</button></div>
    ${S.cpMsg ? `<div class="msg ${S.cp ? 'ok' : 'err'}">${h(S.cpMsg)}</div>` : ''}
    <div class="nav2"><button class="ghost" onclick="keep();S.step=2;render()">← 上一步</button><button class="btn" onclick="keep();next()">下一步：確認訂單 →</button></div>`;
}

function step4() {
  const p = plan(S.gpu), $p = price(), f = S.f;
  return `<h3>4. 確認訂單</h3><p class="mute small">請確認以下資訊，送出後會寄出確認信。</p>
    <div class="lines" style="margin:10px 0;max-width:none">
      <div class="row"><span class="mute">顯卡</span><span>${h(p.name)}（${p.vram}GB）</span></div>
      <div class="row"><span class="mute">時段</span><span>${when(S.start)} ～ ${when(S.start + S.hours * HOUR)}</span></div>
      <div class="row"><span class="mute">租用人</span><span>${h(f.name)}（${f.role}${f.role === '學生' ? '，' + h(f.sid) : ''}）</span></div>
      <div class="row"><span class="mute">Email</span><span>${h(f.email)}</span></div>
      ${f.purpose ? `<div class="row"><span class="mute">用途</span><span>${h(f.purpose)}</span></div>` : ''}
      <div class="row"><span class="mute">時租 × 時數</span><span>${money(p.price)} × ${S.hours} = ${money($p.base)}</span></div>
      ${$p.stuOff ? `<div class="row"><span class="mute">學生 ${INIT.studentRate * 10} 折</span><span style="color:var(--ok)">− ${money($p.stuOff)}</span></div>` : ''}
      ${$p.cpOff ? `<div class="row"><span class="mute">優惠碼 ${h(S.cp.code)}</span><span style="color:var(--ok)">− ${money($p.cpOff)}</span></div>` : ''}
      <div class="row total"><span>應付金額</span><span>${money($p.total)}</span></div></div>
    <label class="agree" style="font-weight:400"><input type="checkbox" ${S.agree ? 'checked' : ''} onchange="S.agree=this.checked;render()">
      我已了解租借規則：逾時使用每小時以 ${INIT.overtimeRate} 倍時租計費；開始前可免費取消。</label>
    <div class="nav2"><button class="ghost" onclick="S.step=3;render()">← 上一步</button>
      <button class="btn" id="submit" ${S.agree ? '' : 'disabled'} onclick="submit()">確認送出預約</button></div>`;
}

function summary() {
  const p = plan(S.gpu), $p = price();
  return `<aside class="panel sum"><h3>訂單摘要</h3>
    <div class="row"><span class="mute">顯卡</span><span>${p ? h(p.name) : '—'}</span></div>
    <div class="row"><span class="mute">開始</span><span>${S.start ? when(S.start) : '—'}</span></div>
    <div class="row"><span class="mute">時數</span><span>${S.hours} 小時</span></div>
    <div class="row"><span class="mute">時租</span><span>${p ? money(p.price) : '—'}</span></div>
    ${$p && $p.stuOff ? `<div class="row"><span class="mute">學生折扣</span><span style="color:var(--ok)">− ${money($p.stuOff)}</span></div>` : ''}
    ${$p && $p.cpOff ? `<div class="row"><span class="mute">優惠碼</span><span style="color:var(--ok)">− ${money($p.cpOff)}</span></div>` : ''}
    <div class="row total"><span>預估</span><span>${$p ? money($p.total) : '—'}</span></div>
    <p class="mute small">逾時以 ${INIT.overtimeRate} 倍時租計費</p></aside>`;
}

function doneView() {
  const o = S.order;
  return `<div class="panel done-box"><div class="big">✓</div><h2>預約成功！</h2>
    <p class="mute">${o.mailed ? `確認信已寄至 ${h(o.email)}` : '訂單已成立（確認信寄送失敗，請記下訂單編號）'}</p>
    <div class="lines">
      <div class="row"><span class="mute">訂單編號</span><b style="color:var(--acc)">${o.no}</b></div>
      <div class="row"><span class="mute">顯卡</span><span>${h(o.gpuName)}</span></div>
      <div class="row"><span class="mute">時段</span><span>${when(o.start)} ～ ${when(o.end)}</span></div>
      <div class="row"><span class="mute">租用人</span><span>${h(o.name)}（${o.role}）</span></div>
      <div class="row"><span class="mute">狀態</span><span class="badge b-${o.status}">${o.status}</span></div>
      <div class="row total"><span>應付金額</span><span>${money(o.paid)}</span></div></div>
    <p class="mute small">連線資訊（SSH / Jupyter）將於開始前 10 分鐘寄出。</p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
      <button class="ghost" onclick="S.q='${h(o.email)}';S.order=null;resetRent();go('orders');search()">查看我的訂單</button>
      <button class="btn" onclick="S.order=null;resetRent();render()">再租一張</button></div></div>`;
}

function orderCard(o) {
  const act = o.status === '已預約' ? `<button class="danger" onclick="endIt('${o.no}','取消這筆預約')">取消預約</button>`
    : (o.status === '使用中' || o.status === '逾時中') ? `<button class="btn" onclick="endIt('${o.no}','結束租用')">結束租用</button>` : '';
  return `<div class="order"><div><b>${o.no}</b>　<span class="badge b-${o.status}">${o.status}</span>　${h(o.gpuName)}</div><div>${act}</div>
    <div class="mute small">${when(o.start)} ～ ${when(o.end)}（${o.hours} 小時）${o.status === '已結束' ? `・實際結束 ${whenM(o.endedAt)}` : ''}</div>
    <div style="text-align:right"><b>${money(o.total)}</b></div>
    <div class="mute small">${h(o.name)}・${o.role}${o.coupon ? '・優惠碼 ' + h(o.coupon) : ''}${o.otHours ? `・<span style="color:var(--bad)">逾時 ${o.otHours} 小時 +${money(o.otFee)}</span>` : ''}</div></div>`;
}

// ---------- 動作 ----------
function rentGpu(id) { resetRent(); S.order = null; S.gpu = id; S.step = 2; go('rent'); }
function resetRent() { Object.assign(S, { step:1, gpu:null, date:null, start:null, hours:4, slots:null, cp:null, cpMsg:'', agree:false }); S.f.coupon = ''; }
function keep() { ['name', 'email', 'sid', 'purpose', 'coupon'].forEach(k => { const el = $('#f-' + k); if (el) S.f[k] = el.value.trim(); }); }

function next() {
  if (S.step === 3) {
    const f = S.f;
    if (!f.name) return toast('請填寫姓名');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) return toast('請填寫正確的 Email');
    if (f.role === '學生' && !f.sid) return toast('學生方案請填寫學號');
    if (f.coupon && (!S.cp || S.cp.code.toUpperCase() !== f.coupon.toUpperCase())) return toast('請先按「套用」確認優惠碼');
  }
  S.step++; render(); window.scrollTo(0, 0);
}

async function loadSlots() {
  try { S.slots = await api('getSlots', S.gpu, S.date); } catch (e) { toast(e); S.slots = { day0:Date.parse(S.date + 'T00:00:00+08:00'), used:Array(96).fill(0) }; }
  if (S.page === 'rent') render();
}

async function applyCoupon() {
  keep();
  S.cp = null; S.cpMsg = '';
  if (S.f.coupon) {
    try { S.cp = await api('checkCoupon', S.f.coupon); S.cpMsg = `✓ 已套用 ${S.cp.code}：${S.cp.desc}`; }
    catch (e) { S.cpMsg = '✗ ' + (e.message || e); }
  }
  render();
}

async function submit() {
  const b = $('#submit'); b.disabled = true; b.textContent = '送出中…';
  try {
    S.order = await api('book', Object.assign({ gpu:S.gpu, start:S.start, hours:S.hours }, S.f));
    INIT = await api('getInit');
    S.rep = null;
    render(); window.scrollTo(0, 0);
  } catch (e) { toast(e); S.slots = null; b.disabled = false; b.textContent = '確認送出預約'; }
}

async function search() {
  const el = $('#q'); if (el) S.q = el.value.trim();
  S.note = null;
  try { S.list = await api('findOrders', S.q); } catch (e) { toast(e); S.list = null; }
  render();
}

async function endIt(no, what) {
  if (!confirm(`確定要${what}（${no}）嗎？`)) return;
  try {
    const o = await api('endRental', no);
    S.note = o.status === '已取消'
      ? { html:`已取消預約 <b>${o.no}</b>，不會收取費用。` }
      : { warn: o.otHours > 0, html:`<b>${o.no}</b> 已結束租用。租用費 ${money(o.paid)}${o.otHours ? `，逾時 ${o.otHours} 小時，逾時費 ${money(o.otFee)}` : '，無逾時'}，總金額 <b>${money(o.total)}</b>。` };
    S.list = S.list.map(x => x.no === o.no ? o : x);
    S.rep = null; INIT = await api('getInit');
    render();
  } catch (e) { toast(e); }
}

async function loadReport() {
  try { S.rep = await api('getReport'); } catch (e) { toast(e); return; }
  if (S.page === 'report') render();
}

api('getInit').then(d => { INIT = d; render(); }).catch(e => { $('#app').innerHTML = `<div class="loading">載入失敗：${h(e.message || e)}</div>`; });
</script>
</body>
</html>
